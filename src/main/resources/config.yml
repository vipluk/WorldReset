# === WorldReset v2.0 Configuration ===

# Select in-game language for messages and interface.
# Available options: en (English), de (German), pl (Polish)
language: en

# Name of the custom world that will be managed and reset by the plugin.
# IMPORTANT: This MUST NOT be "world" (default server world)!
# Use something like "game_world", "speedrun", "manhunt".
game-world-name: "game_world"

# --- Death Limit ---
# Number of player deaths that will trigger an automatic world reset.
# 0 = disabled, 1 = classic hardcore (reset on first death), >1 = shared lives pool.
death-limit: 1

# --- Scoreboard ---
scoreboard:
  # Should plugin scoreboards (objectives starting with wr_) be cleared during a world reset?
  clear-on-reset: false

# --- GameRules ---
# Preserve game rules (/gamerule) across world resets? (true/false)
preserve-gamerules: true

# --- Datapacks ---
datapacks:
  # Automatically inject datapacks into every newly generated/reset world? (true/false)
  enabled: false

  # Directory containing datapacks (.zip files or uncompressed directories with pack.mcmeta).
  # Supports relative paths (e.g. WorldReset_Datapacks or ../../datapacks) and absolute paths.
  folder: "WorldReset_Datapacks"

# --- Backup ---
backup:
  # Enable automatic backups before deleting the world? (true/false)
  enabled: true

  # Directory path to store world backups.
  folder: "WorldReset_BackUps"

  # Backup retention limit ("all" = keep all, or a number e.g. 5 = keep the last 5 backups).
  limit: "30"

# --- Seed ---
seed:
  # Use a fixed seed with every reset?
  # false = Each reset generates a random, fresh world seed.
  # true  = Each reset uses the fixed seed value configured below.
  use-fixed: false

  # Fixed seed value (numeric seed or text string).
  value: "2048005618087379093"

# --- World Templates ---
# Load pre-made custom world folders instead of generating from a seed.
template:
  # Enable world templates loader? (true/false)
  enabled: false

  # Directory containing template map folders. Supports relative and absolute paths.
  folder: "WorldReset_Templates"

# --- Structure & Biome Filter ---
# The plugin will generate a world, locate the target, and shift the spawn point there.
# If both fields are left empty (""), the filter is disabled (random default spawn).
# If both structure and biome are specified, the plugin searches for the structure INSIDE that biome.
filter:
  # Are spawn filters active? (true/false)
  enabled: true

  # 1. STRUCTURE (Leave empty "" to disable structure filter)
  # General category (e.g. VILLAGE) or specific identifier (e.g. minecraft:village_plains).
  # Popular choices: VILLAGE, SHIPWRECK, RUINED_PORTAL, ANCIENT_CITY, MANSION,
  # STRONGHOLD, DESERT_PYRAMID, JUNGLE_PYRAMID, PILLAGER_OUTPOST, MINESHAFT, IGLOO,
  # SWAMP_HUT, MONUMENT, TRAIL_RUINS, TRIAL_CHAMBERS.
  structure: ""

  # 2. BIOME (Leave empty "" to disable biome filter)
  # Examples: PLAINS, DESERT, BADLANDS, CHERRY_GROVE, MUSHROOM_FIELDS, JUNGLE,
  # ICE_SPIKES, SWAMP, SAVANNA, TAIGA, FOREST, PALE_GARDEN.
  biome: ""

  # Maximum attempts to search for a safe island/land in water/island biomes.
  # Higher = better chance of finding land, but longer search duration.
  attempts: 1

# Should the plugin broadcast world reset messages in global chat? (true/false)
broadcast-messages: true

# --- TIMER (Speedrun Stopwatch) ---
timer:
  # Enable the speedrun stopwatch system? (true/false)
  enabled: false

  # Should the speedrun timer be visible on players' action bar / titles? (true/false)
  visible: true

  # Time counting mode:
  # RTA (Real-Time Attack) - counts real time, immune to server tick lag (recommended).
  # IGT (In-Game Time)      - counts server game ticks, slows down when server lags.
  mode: "RTA"

  # Stopwatch scope (group or individual):
  # GLOBAL     - one shared stopwatch for all players on the server.
  # INDIVIDUAL - each player runs their own personal timer.
  scope: "GLOBAL"

  goal:
    # Event that automatically stops the timer:
    # Options: ENTITY, PORTAL, ADVANCEMENT, BLOCK, ITEM, NONE
    type: "PORTAL"

    # Exact value of the chosen goal. Examples:
    # ENTITY      -> minecraft:ender_dragon (kill the ender dragon)
    # PORTAL      -> NETHER, END, OVERWORLD, ANY (enter dimensional portal)
    # ADVANCEMENT -> story/mine_diamond (complete advancement)
    # BLOCK       -> obsidian (break obsidian block)
    # ITEM        -> diamond (obtain diamond in inventory)
    value: "OVERWORLD"

# --- RADAR / COMPASS (Locator Bar) ---
compass:
  # Enable Minecraft's native Locator Bar (player position ribbon at the top of the screen)?
  enabled: true

# --- AUTORESET (Scheduled Resets) ---
autoreset:
  # Enable the scheduled automated reset timer?
  enabled: false

  # Should the autoreset countdown be visible to players? (true/false)
  visible: true

  # Time interval for scheduled resets (e.g. 60s, 5m, 1h).
  time: "1h"

  # Enable looping (starts a new countdown immediately after reset)?
  loop: true

  # Is the countdown paused?
  paused: true

# --- LIMBO (Waiting Lobby & Delays) ---
limbo:
  # Should new players joining an ongoing game be sent to Limbo lobby (instead of active game)?
  new-players-to-limbo: false

  # Should the server start in Limbo lobby mode after boot/restart?
  start-in-limbo: false

  # Delay (in seconds) before automatic teleport TO Limbo (e.g. on reset).
  # Players see a countdown on screen but can keep playing.
  # 0 = instant teleport (no countdown).
  delay-in: 0

  # Delay (in seconds) before automatic teleport FROM Limbo to the new game (e.g. after reset).
  # Players in Limbo see a countdown before the game starts.
  # 0 = instant teleport (no countdown).
  delay-out: 5

# --- GIVE (Automatic Starter Items) ---
give:
  # Automatically give a boat to players if spawn is in water?
  boat-if-water: true

  # Automatically give wood to players if spawn is underground?
  wood-if-underground: true

  # Amount of wood given for underground spawn (1-64). 0 = disabled.
  wood-amount: 5
