name: Sync Inprogress to Main

on:
  push:
    branches:
      - inprogress

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all branches and history

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync selected files to main
        run: |
          # Checkout main branch and reset to match remote main
          git checkout main
          git reset --hard origin/main

          # Remove existing tracked files we want to replace, to ensure deleted files in inprogress are also deleted on main
          rm -rf src/ .github/ .idea/ .kiro/ 2>/dev/null || true
          rm -f pom.xml .gitignore LICENSE README.md description.md changelog.md changelog*.md update*.md "Optymalizacja Spawnu Wyspy w WorldReset.md" "Problem spawnu na oceanie.md" 2>/dev/null || true

          # Checkout only necessary files and directories from the inprogress branch
          git checkout inprogress -- src/
          git checkout inprogress -- pom.xml
          git checkout inprogress -- .gitignore
          git checkout inprogress -- LICENSE

          # Rename description.md to README.md for the main branch
          git checkout inprogress -- description.md
          mv description.md README.md

          # Stage all changes and check if there are any staged changes to commit
          git add -A
          if ! git diff --quiet --cached; then
            git commit -m "chore: sync clean code and docs from inprogress [skip ci]"
            git push origin main
          else
            echo "No changes to sync."
          fi
