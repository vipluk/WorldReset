name: Sync Inprogress to Main

on:
  push:
    branches:
      - inprogress

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all branches and history

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync selected files to main
        run: |
          # Checkout main branch and reset to match remote main
          git checkout main
          git reset --hard origin/main

          # Remove existing tracked files we want to replace, to ensure deleted files in inprogress are also deleted on main
          git rm -rf src/ .github/ 2>/dev/null || true
          git rm -f pom.xml .gitignore LICENSE README.md description.md changelog.md changelog*.md update*.md "Optymalizacja Spawnu Wyspy w WorldReset.md" "Problem spawnu na oceanie.md" 2>/dev/null || true

          # Checkout only necessary files and directories from the inprogress branch
          git checkout inprogress -- src/
          git checkout inprogress -- .github/
          git checkout inprogress -- pom.xml
          git checkout inprogress -- .gitignore
          git checkout inprogress -- LICENSE
          git checkout inprogress -- README.md
          git checkout inprogress -- description.md
          git checkout inprogress -- changelog.md
          git checkout inprogress -- changelog*.md
          git checkout inprogress -- update*.md
          git checkout inprogress -- "Optymalizacja Spawnu Wyspy w WorldReset.md"
          git checkout inprogress -- "Problem spawnu na oceanie.md"

          # Check if there are changes to commit on main
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: sync clean code and docs from inprogress [skip ci]"
            git push origin main
          else
            echo "No changes to sync."
          fi
